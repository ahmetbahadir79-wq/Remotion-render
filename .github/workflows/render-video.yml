# Worker Registry Ref: 1788361261771
name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Kitap / Proje Slug'
        required: true
        default: 'single-dad-dilemma'
      composition:
        description: 'Composition ID'
        required: false
        default: ''
      chunk_size:
        description: 'Chunk boyutu'
        required: false
        default: '400'
      concurrency:
        description: 'Concurrency'
        required: false
        default: '2'

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies (FFmpeg & Chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Books Registry
        run: node scripts/gen-books-registry.js

      - name: Master audio
        run: node scripts/master-audio.js --slug="${{ github.event.inputs.slug }}" --update-config || echo "master-audio skipped"

      - name: Render Video (Local Chunking on Runner)
        run: |
          node scripts/render.js \
            --slug="${{ github.event.inputs.slug }}" \
            ${{ github.event.inputs.composition != '' && format('--composition="{0}"', github.event.inputs.composition) || '' }} \
            --method=local \
            --chunk-size=${{ github.event.inputs.chunk_size }} \
            --concurrency=${{ github.event.inputs.concurrency }}

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.slug }}
          path: |
            out/${{ github.event.inputs.slug }}.mp4
            out/*.mp4
          retention-days: 14
          if-no-files-found: error
